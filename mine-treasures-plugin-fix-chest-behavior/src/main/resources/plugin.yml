name: Cyber-Chests
version: 1.0.0
main: com.slapthedodo.treasurechests.TreasureChests
api-version: '1.21'
softdepend: [WorldGuard]
authors: [slapthedodo, cybernetic]
commands:
  givetreasureitem:
    description: Gibt einem Spieler ein Schatz-Item.
    usage: /givetreasureitem <item> <spieler>
    permission: treasurechests.give
  cybergiverandomspawner:
    description: Gibt einem Spieler einen zufälligen Spawner.
    usage: /cybergiverandomspawner <spieler>
    permission: treasurechests.givespawner
